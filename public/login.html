<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · akapal-geap chat portal</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="centered">
    <main class="login">
      <h1 class="login__title">Sign in</h1>
      <p class="muted">Demo user: demo@example.com / demo1234</p>

      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
          <p class="error" data-error="email"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p class="error" data-error="password"></p>
        </div>

        <p class="error" id="form-error"></p>

        <button type="submit" id="submit" class="btn">Sign in</button>
      </form>
    </main>

    <script src="/js/login.js" defer></script>
  </body>
</html>
